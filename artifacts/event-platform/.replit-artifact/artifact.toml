kind = "web"
previewPath = "/"
title = "Gatherly Events"
description = "A community event scheduling and registration platform with public event discovery, attendee sign-up, organizer metrics, donation tracking, charity allocation, notifications, and deployment-ready integration hooks."
version = "1.0.0"
id = "artifacts/event-platform"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19579

[services.development]
run = "pnpm --filter @workspace/event-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/event-platform", "run", "build" ]
serve = "static"
publicDir = "artifacts/event-platform/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19579"
BASE_PATH = "/"
